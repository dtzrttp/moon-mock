name: MoonBit 校验

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装固定版本 MoonBit
        env:
          MOON_HOME: ${{ runner.temp }}/moon-mock-moon
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moonbit-install.sh"
          bash "$RUNNER_TEMP/moonbit-install.sh" '0.10.18+6c83a7f62'
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --deny-warn
      - run: node tools/cli-smoke.mjs ${{ matrix.target }}
      - run: node tools/consumer-smoke.mjs ${{ matrix.target }}
      - run: moon bench runtime generator --target ${{ matrix.target }} --release --deny-warn --build-only
      - run: node tools/package-smoke.mjs ${{ matrix.target }}
